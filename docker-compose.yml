# Minden egy paranccsal indul: docker compose up -d --build
# A CMS ugyanennek a projektnek a része, nem külön "cms" projekt: a saját
# fájlja a cms/.env-ből olvas, az adatai a közös cms-data volume-on vannak.
name: portfolio

include:
  - cms/docker-compose.yml

services:
  portfolio:
    build:
      context: .
      args:
        # Ha az oldal egy al-útvonalon áll (pl. portfolio), a prefix / nélkül.
        # Üresen a domain gyökerére épül.
        BASE_PATH: "${BASE_PATH:-}"
        # A nyilvános cím, pl. https://martinporkolab.hu (ez az alapértelmezés).
        SITE_URL: "${SITE_URL:-}"
        PUBLIC_CONTACT_EMAIL: "${PUBLIC_CONTACT_EMAIL:-}"
        PUBLIC_CONTACT_ENDPOINT: "${PUBLIC_CONTACT_ENDPOINT:-}"
        PUBLIC_CONTACT_ACCESS_KEY: "${PUBLIC_CONTACT_ACCESS_KEY:-}"
    image: portfolio:latest
    # Rögzített név, hogy a reverse proxy stabil hosztnéven érje el.
    container_name: portfolio
    ports:
      - "${PORT:-8080}:80"
    # A CMS adatbázisa és képei. A szerver kérésenként olvassa (csak olvasásra
    # nyitja meg); azért nem :ro, mert az SQLite WAL módban az olvasónak is
    # írnia kell a megosztott -shm fájlt. A helyük az image-ben van megadva.
    volumes:
      - cms-data:/data
    # A PREVIEW_SECRET innen jön, ugyanaz, amivel a CMS az előnézeti linket aláírja.
    env_file:
      - path: cms/.env
        required: false
    depends_on:
      - cms
    restart: unless-stopped

  # Fejlesztéshez: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${DEV_PORT:-4321}:4321"

