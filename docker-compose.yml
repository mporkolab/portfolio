services:
  portfolio:
    build:
      context: .
      args:
        # Al-útvonalas proxy mögé: BASE_PATH=portfolio (prefix / nélkül).
        BASE_PATH: "${BASE_PATH:-}"
    image: portfolio:latest
    # Rögzített név, hogy a reverse proxy stabil hosztnéven érje el.
    container_name: portfolio
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped

  # Fejlesztéshez: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${DEV_PORT:-4321}:4321"

