services:
  portfolio:
    build: .
    image: portfolio:latest
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped

  # Fejlesztéshez: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${DEV_PORT:-4321}:4321"
