# Minden egy paranccsal indul: docker compose up -d --build
# A CMS ugyanennek a projektnek a része, nem külön "cms" projekt: a saját
# fájlja a cms/.env-ből olvas, a kötetei a cms/data alatt vannak.
name: portfolio

include:
  - cms/docker-compose.yml

services:
  portfolio:
    build:
      context: .
      args:
        # Ha az oldal egy al-útvonalon áll (pl. portfolio), a prefix / nélkül.
        # Üresen a domain gyökerére épül.
        BASE_PATH: "${BASE_PATH:-}"
        PUBLIC_CONTACT_EMAIL: "${PUBLIC_CONTACT_EMAIL:-}"
        PUBLIC_CONTACT_ENDPOINT: "${PUBLIC_CONTACT_ENDPOINT:-}"
        PUBLIC_CONTACT_ACCESS_KEY: "${PUBLIC_CONTACT_ACCESS_KEY:-}"
    image: portfolio:latest
    # Rögzített név, hogy a reverse proxy stabil hosztnéven érje el.
    container_name: portfolio
    ports:
      - "${PORT:-8080}:80"
    environment:
      # A szerver kérésenként olvassa a projekteket, a compose hálózaton.
      GHOST_URL: http://ghost:2368
      GHOST_CONTENT_KEY: "${GHOST_CONTENT_KEY:?add GHOST_CONTENT_KEY to .env (Ghost admin → Settings → Integrations)}"
    depends_on:
      - ghost
    restart: unless-stopped

  # Fejlesztéshez: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${DEV_PORT:-4321}:4321"

