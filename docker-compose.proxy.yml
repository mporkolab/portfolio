# Reverse proxy (pl. Cosmos) mögé. A szerver .env-jébe:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml
#   PROXY_NETWORK=<a proxy hálózata>
# Így a sima `docker compose up -d` is ezt a fájlt is használja.
#
# A proxy route célja ilyenkor: http://portfolio:80
services:
  portfolio:
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK to the reverse proxy's docker network}
