# Reverse proxy (pl. Cosmos) mögé:
#   PROXY_NETWORK=<a proxy hálózata> \
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
#
# A proxy route célja ilyenkor: http://portfolio:80
services:
  portfolio:
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK to the reverse proxy's docker network}
