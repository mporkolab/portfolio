# Directus a portfólió tartalmához. A projektek innen jönnek, nem a kódból.
# A gyökér docker-compose.yml include-olja, onnan indítsd: docker compose up -d
# A titkok a cms/.env fájlból jönnek (nincs verziókövetve) — cms/.env.example a minta.
services:
  directus-db:
    image: postgres:16-alpine
    container_name: portfolio-cms-db
    restart: unless-stopped
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?add DB_PASSWORD to cms/.env}
      POSTGRES_DB: directus
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U directus -d directus']
      interval: 5s
      timeout: 5s
      retries: 20

  directus:
    image: directus/directus:11
    container_name: portfolio-cms
    restart: unless-stopped
    ports:
      - '${CMS_PORT:-8055}:8055'
    volumes:
      - ./data/uploads:/directus/uploads
      - ./data/extensions:/directus/extensions
    depends_on:
      directus-db:
        condition: service_healthy
    environment:
      KEY: ${CMS_KEY:?add CMS_KEY to cms/.env}
      SECRET: ${CMS_SECRET:?add CMS_SECRET to cms/.env}
      DB_CLIENT: pg
      DB_HOST: directus-db
      DB_PORT: '5432'
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:?add CMS_ADMIN_EMAIL to cms/.env}
      ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:?add CMS_ADMIN_PASSWORD to cms/.env}
      PUBLIC_URL: ${CMS_PUBLIC_URL:-http://localhost:8055}
      # A build a nyilvános (autentikáció nélküli) olvasásra támaszkodik.
      CORS_ENABLED: 'true'

  # Mentéskor a Directus Flow-ja ezt hívja (http://rebuild-hook:9009/rebuild), ez
  # pedig lefuttatja a cms/rebuild.sh-t. Port nincs kiadva: csak a compose
  # hálózaton, a Directus felől érhető el. A hoszt Docker-démonján épít — a
  # sockettel ugyanazt teheti, amit a gépen egy docker parancs.
  rebuild-hook:
    build:
      context: .
      dockerfile_inline: |
        FROM docker:cli
        RUN apk add --no-cache bash curl nodejs
    container_name: portfolio-rebuild-hook
    restart: unless-stopped
    working_dir: /repo
    entrypoint: ['node', 'cms/rebuild-hook.mjs']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/repo:ro
    environment:
      REBUILD_TOKEN: ${REBUILD_TOKEN:?add REBUILD_TOKEN to cms/.env}
      REBUILD_HOST: 0.0.0.0
      # A rebuild.sh a CMS-t innen, a compose hálózaton ellenőrzi.
      REBUILD_CMS_URL: http://directus:8055
      REBUILD_IN_CONTAINER: '1'
    depends_on:
      - directus
