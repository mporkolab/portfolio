# A portfólió saját CMS-e. A projektek innen jönnek, nem a kódból: a portfólió
# szervere kérésenként ugyanabból az SQLite-ból olvas, így egy publikált
# projekt azonnal kint van.
# A gyökér docker-compose.yml include-olja, onnan indítsd: docker compose up -d
# A beállítások a cms/.env fájlból jönnek (nincs verziókövetve) — cms/.env.example a minta.
# Ugyanaz a projektnév, mint a gyökérben: így a cms/ mappából indítva is ugyanazt
# a projektet kezeli, és nem ütközik a saját konténereivel.
name: portfolio
services:
  cms:
    build: .
    image: portfolio-cms:latest
    container_name: portfolio-cms
    restart: unless-stopped
    # Belépés nincs: a port kötése dönti el, ki éri el. Élesben a Tailscale-cím.
    ports:
      - '${CMS_BIND:-127.0.0.1}:${CMS_PORT:-2368}:2368'
    volumes:
      - cms-data:/data
    # CMS_URL, PORTFOLIO_URL, PREVIEW_SECRET. Nélküle is indul (localhost, előnézet nélkül).
    env_file:
      - path: ./.env
        required: false
    mem_limit: 256m

volumes:
  # Az adatbázis (cms.db) és a feltöltött képek (uploads/). MENTENI KELL.
  # Docker volume, nem bind mount: a CMS és a portfólió egyszerre használja
  # az SQLite-ot, és a macOS-es Docker Desktop megosztott mappáján a WAL
  # zárolása nem megbízható.
  cms-data:
